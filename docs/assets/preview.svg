    <text x="779" y="433" font-size="18" fill="#173a39" font-weight="bold">Re: Friday meeting plans</text>
    <text x="779" y="465" font-size="12" fill="#38684f">This conversation includes a message you sent.</text>
    <rect x="779" y="495" width="169" height="39" rx="7" fill="#235b4a"/><text x="795" y="519" font-size="13" fill="#fff">Restore to Primary</text>
    <rect x="958" y="495" width="166" height="39" rx="7" fill="#e8eee4"/><text x="983" y="519" font-size="13" fill="#38614d">Dismiss for now</text>
    <text x="761" y="596" font-size="12" fill="#718174">Local processing. You choose what to restore.</text>
    <text x="36" y="664" font-size="11" fill="#718174">Illustrated preview · Fictional mail · Real Gmail access currently requires an invited test account</text>
