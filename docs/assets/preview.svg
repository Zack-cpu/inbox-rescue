<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Inbox Rescue beside an illustrated inbox</title>
  <desc id="description">A fictional inbox with a review side panel showing separate Spam and Promotions queues and a message from Alex. This is an illustration, not a live mailbox screenshot.</desc>
  <rect width="1200" height="680" rx="24" fill="#e8eee7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="42" font-size="14" fill="#526b60" letter-spacing="2">INBOX RESCUE · PREVIEW</text>
    <rect x="28" y="65" width="1144" height="578" rx="16" fill="#fff" stroke="#d4dfd4"/>
    <path d="M44 65h1112a16 16 0 0 1 16 16v30H28V81a16 16 0 0 1 16-16" fill="#f0f3ef"/>
    <circle cx="52" cy="89" r="5" fill="#b7c7bb"/><circle cx="70" cy="89" r="5" fill="#b7c7bb"/><circle cx="88" cy="89" r="5" fill="#b7c7bb"/>
    <rect x="130" y="77" width="610" height="25" rx="12" fill="#e2e9e0"/>
    <text x="150" y="94" font-size="12" fill="#6c7d70">Your inbox</text>
    <rect x="29" y="111" width="144" height="515" fill="#f7f9f5"/>
    <rect x="44" y="142" width="112" height="38" rx="12" fill="#e1ebde"/>
    <text x="63" y="166" font-size="14" fill="#245c49">Compose</text>
    <text x="50" y="223" font-size="14" fill="#254b3e" font-weight="bold">Inbox</text>
    <text x="50" y="263" font-size="14" fill="#748379">Starred</text>
    <text x="50" y="303" font-size="14" fill="#748379">Sent</text>
    <text x="50" y="343" font-size="14" fill="#748379">Drafts</text>
    <text x="199" y="157" font-size="20" fill="#284c40" font-weight="bold">Your everyday inbox</text>
    <text x="199" y="191" font-size="13" fill="#738078">Keep reading mail where you already do.</text>
    <rect x="195" y="219" width="510" height="40" rx="7" fill="#edf2e9"/>
    <text x="212" y="244" font-size="13" fill="#38614d">Primary</text><text x="350" y="244" font-size="13" fill="#78857a">Promotions</text><text x="518" y="244" font-size="13" fill="#78857a">Updates</text>
    <g fill="#e2e9e0">
      <rect x="209" y="291" width="100" height="10" rx="5"/><rect x="333" y="291" width="275" height="10" rx="5"/>
      <rect x="209" y="345" width="82" height="10" rx="5"/><rect x="333" y="345" width="313" height="10" rx="5"/>
      <rect x="209" y="399" width="110" height="10" rx="5"/><rect x="333" y="399" width="248" height="10" rx="5"/>
      <rect x="209" y="453" width="90" height="10" rx="5"/><rect x="333" y="453" width="288" height="10" rx="5"/>
      <rect x="209" y="507" width="100" height="10" rx="5"/><rect x="333" y="507" width="265" height="10" rx="5"/>
      <rect x="209" y="561" width="74" height="10" rx="5"/><rect x="333" y="561" width="296" height="10" rx="5"/>
    </g>
    <path d="M195 320h510M195 374h510M195 428h510M195 482h510M195 536h510M195 590h510" stroke="#edf1eb"/>
    <rect x="738" y="111" width="433" height="515" fill="#f6f8f4"/>
    <path d="M738 111v515" stroke="#d5dfd3"/>
    <text x="761" y="147" font-size="14" fill="#173a39" font-weight="bold" letter-spacing="1.3">INBOX RESCUE</text>
    <rect x="1070" y="128" width="76" height="26" rx="13" fill="#e2ebdc"/><text x="1086" y="146" font-size="12" fill="#426b50">Demo</text>
    <text x="761" y="197" font-size="26" fill="#173a39" font-weight="bold">Important mail.</text>
    <text x="761" y="228" font-size="26" fill="#173a39" font-weight="bold">Back in sight.</text>
    <text x="761" y="265" font-size="12" fill="#687d6c">Fictional messages · Your real mailbox is unchanged</text>
    <rect x="761" y="287" width="185" height="38" rx="8" fill="#235b4a"/><text x="821" y="311" font-size="13" fill="#fff">Spam (3)</text>
    <rect x="955" y="287" width="190" height="38" rx="8" fill="#e8eee4" stroke="#d7e0d6"/><text x="1002" y="311" font-size="13" fill="#235b4a">Promotions (2)</text>
    <text x="761" y="355" font-size="12" fill="#64766a">Checked 5 fictional messages.</text>
    <rect x="761" y="373" width="384" height="190" rx="12" fill="#fff" stroke="#dbe3d9"/>
