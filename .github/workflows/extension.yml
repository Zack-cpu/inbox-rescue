name: Extension checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test extension/tests/*.test.mjs
      - run: node --check extension/background.js
      - run: node --input-type=module --check < extension/panel.js
