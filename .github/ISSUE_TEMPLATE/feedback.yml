name: Preview feedback
description: Tell us what was useful or confusing
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not share real emails, account addresses, or credentials."
  - type: textarea
    id: feedback
    attributes:
      label: What worked, and what should improve?
      description: Did you find a missed message? Was installation or review confusing?
    validations:
      required: true
