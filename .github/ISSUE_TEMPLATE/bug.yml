name: Bug report
description: Report installation, connection, scanning, or review problems
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not post Gmail addresses, message bodies, tokens, credentials JSON, or client secrets. Real Gmail is currently invite-only; access-blocked errors can reflect that restriction."
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 0.3.0 Preview
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Edge on Windows 11
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Fictional demo
        - Invited Gmail account
        - Installation / before connecting
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and what happened
      description: Include expected behavior and the displayed error. Redact any screenshots.
    validations:
      required: true
