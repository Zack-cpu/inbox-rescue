[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
rescue = ["static/*"]

[tool.setuptools.packages.find]
include = ["rescue*"]

[project]
name = "inbox-rescue"
version = "0.1.0"
description = "A local-first Gmail missed-mail review assistant"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "google-api-python-client>=2.150,<3", "google-auth-oauthlib>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
