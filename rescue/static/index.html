<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox Rescue</title><link rel="stylesheet" href="/style.css"><script src="/ui.js" defer></script></head>
<body><main><header><span class="brand">✉ INBOX RESCUE</span><span id="mode">本地运行</span></header><section class="intro"><p class="eyebrow">少一点遗漏，多一点安心</p><h1>重要来信，<br>不该被错过。</h1><p>检查最近 7 天的垃圾邮件与推广分类，结合近期往来找出值得再看一眼的邮件。</p><button id="scan">检查可能遗漏的邮件</button><p class="small">只有你点击恢复，才会改变邮件分类。历史往来不代表身份可信。</p></section><section><div class="heading"><h2>待你确认</h2><label><input id="all" type="checkbox"> 显示所有已检查邮件</label></div><p id="status" role="status" aria-live="polite">点击上方按钮开始。演示模式无需连接邮箱。</p><div id="items"></div></section><footer>本地处理 · 无 AI 服务 · 不发送邮件 · 不加载邮件图片或附件</footer></main></body></html>
